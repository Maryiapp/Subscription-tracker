<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="p-4 md:p-8">

    <!-- AUTH SECTION -->
    <div id="authSection" class="max-w-md mx-auto mt-16 glass-card p-8 rounded-3xl">
        <div class="text-center mb-8">
            <div class="inline-flex p-4 rounded-2xl bg-indigo-600/20 text-indigo-400 mb-3 border border-indigo-500/20">
                <i class="fa-solid fa-wallet text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Subscription Tracker</h1>
            <p class="text-slate-400 text-sm mt-1">Manage all your recurring expenses in one place</p>
        </div>

        <div class="flex p-1 bg-slate-900/60 rounded-xl mb-6 border border-white/5">
            <button id="tabLogin" class="flex-1 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white transition">Log In</button>
            <button id="tabRegister" class="flex-1 py-2 text-sm font-medium rounded-lg text-slate-400 hover:text-white transition">Sign Up</button>
        </div>

        <form id="authForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Email</label>
                <input type="email" id="authEmail" required class="w-full glass-input px-4 py-3 rounded-xl text-sm" placeholder="name@example.com">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Password</label>
                <input type="password" id="authPassword" required class="w-full glass-input px-4 py-3 rounded-xl text-sm" placeholder="••••••••">
            </div>
            <div id="authError" class="text-rose-400 text-xs hidden"></div>
            <button type="submit" id="authSubmitBtn" class="w-full btn-primary py-3 rounded-xl font-semibold text-sm">Log In</button>
        </form>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="appSection" class="max-w-6xl mx-auto space-y-8 hidden">
        
        <!-- HEADER -->
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 glass-card p-6 rounded-3xl">
            <div class="flex items-center gap-4">
                <div class="p-3 rounded-2xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/20">
                    <i class="fa-solid fa-wallet text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold">Subscription Tracker</h1>
                    <p id="userEmailBadge" class="text-xs text-slate-400">user@example.com</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button id="openAddModalBtn" class="btn-primary px-5 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Add Subscription
                </button>
                <button id="logoutBtn" class="px-4 py-2.5 rounded-xl text-sm font-medium glass-input hover:bg-rose-500/10 hover:text-rose-400 hover:border-rose-500/30 transition">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <!-- STATS CARDS -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="glass-card p-6 rounded-3xl">
                <div class="flex items-center justify-between text-slate-400 mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider">Monthly Expenses</span>
                    <i class="fa-solid fa-calendar-days text-indigo-400"></i>
                </div>
                <div id="statMonthly" class="text-3xl font-extrabold text-white">$0.00</div>
            </div>

            <div class="glass-card p-6 rounded-3xl">
                <div class="flex items-center justify-between text-slate-400 mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider">Yearly Expenses</span>
                    <i class="fa-solid fa-chart-line text-emerald-400"></i>
                </div>
                <div id="statYearly" class="text-3xl font-extrabold text-white">$0.00</div>
            </div>

            <div class="glass-card p-6 rounded-3xl">
                <div class="flex items-center justify-between text-slate-400 mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider">Active Subscriptions</span>
                    <i class="fa-solid fa-circle-check text-emerald-400"></i>
                </div>
                <div id="statActiveCount" class="text-3xl font-extrabold text-emerald-400">0</div>
            </div>

            <div class="glass-card p-6 rounded-3xl">
                <div class="flex items-center justify-between text-slate-400 mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider">Most Expensive</span>
                    <i class="fa-solid fa-crown text-amber-400"></i>
                </div>
                <div id="statMostExpensive" class="text-lg font-bold text-slate-200 truncate">—</div>
            </div>
        </div>

        <!-- SUBSCRIPTIONS GRID -->
        <main>
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-lg font-bold flex items-center gap-2">
                    My Subscriptions <span id="subsCountBadge" class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full border border-white/5">0</span>
                </h2>
            </div>

            <div id="subscriptionsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>

            <div id="emptyState" class="glass-card p-12 text-center rounded-3xl hidden">
                <i class="fa-solid fa-folder-open text-4xl text-slate-600 mb-3"></i>
                <p class="text-slate-400 font-medium">No subscriptions added yet.</p>
            </div>
        </main>
    </div>

    <!-- MODAL -->
    <div id="subModal" class="fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
        <div class="glass-card w-full max-w-md p-6 rounded-3xl space-y-5">
            <div class="flex items-center justify-between">
                <h3 id="modalTitle" class="text-lg font-bold">New Subscription</h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="subForm" class="space-y-4">
                <input type="hidden" id="subId">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Title</label>
                    <input type="text" id="subTitle" required placeholder="e.g. Netflix" class="w-full glass-input px-4 py-2.5 rounded-xl text-sm">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Price</label>
                        <input type="number" step="0.01" id="subPrice" required placeholder="9.99" class="w-full glass-input px-4 py-2.5 rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Currency</label>
                        <select id="subCurrency" class="w-full glass-input px-4 py-2.5 rounded-xl text-sm bg-slate-900">
                            <option value="USD">USD ($)</option>
                            <option value="EUR">EUR (€)</option>
                            <option value="GBP">GBP (£)</option>
                            <option value="RUB">RUB (₽)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Billing Cycle</label>
                    <select id="subBillingCycle" class="w-full glass-input px-4 py-2.5 rounded-xl text-sm bg-slate-900">
                        <option value="monthly">Monthly</option>
                        <option value="yearly">Yearly</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Category</label>
                    <select id="subCategory" class="w-full glass-input px-4 py-2.5 rounded-xl text-sm bg-slate-900">
                        <option value="">No Category</option>
                    </select>
                </div>

                <div class="flex items-center gap-2 pt-2">
                    <input type="checkbox" id="subIsActive" checked class="w-4 h-4 accent-indigo-600 rounded">
                    <label for="subIsActive" class="text-sm font-medium text-slate-300">Active Subscription</label>
                </div>

                <div class="pt-4 flex gap-3">
                    <button type="button" id="cancelModalBtn" class="flex-1 py-2.5 rounded-xl text-sm font-semibold glass-input">Cancel</button>
                    <button type="submit" class="flex-1 btn-primary py-2.5 rounded-xl text-sm font-semibold">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
